# Weekly upgrade proposals for what the audit job would otherwise fail on.
# Grouped so a week's bumps are one review, not thirty.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      mobile:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The CI actions are pinned to commits (a tag can be repointed by whoever
  # owns the action, and it runs with this repository's token). Pinned means
  # stale unless something proposes the bumps, which is this.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
