name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs, for proving the suite is deterministic: the same commit, run
  # repeatedly, must be green every time.
  workflow_dispatch:

# A new push to the same PR cancels the run it supersedes. Nobody is waiting
# on the result of a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The web client and the API share one package, one lockfile and one
  # typecheck, so they are one job. The job names below are what branch
  # protection requires by name — rename one and the protection silently stops
  # applying to it.
  server-web:
    runs-on: ubuntu-latest

    # A real Postgres, because the suite tests behaviour only a real one has:
    # column types, defaults, constraints, and `timestamp without time zone`
    # semantics. A fake would pass and prove nothing.
    #
    # Its password is derived per run rather than written down. It is not a
    # secret — the database lives inside this job on the runner's loopback and
    # is destroyed with it — but a literal reads as one to every scanner, and a
    # derived value means there is nothing in the repository to leak. Spelled
    # out at each use because a service container's env can't read `env`.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Without this the job races the container and fails on connection
        # refused, intermittently, which is the worst kind of red build.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite derives its own database from this by suffixing `_test`, and
      # creates it on first run. Nothing here touches a real environment.
      DATABASE_URL: postgresql://postgres:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/postgres
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci`, not `npm install`: it refuses to run if package.json and the
      # lockfile disagree, which is exactly the case where "works on my
      # machine" is about to become "works on nobody else's".
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Compared to a committed baseline rather than required to be zero — see
      # scripts/typecheck-ratchet.mjs. Fails only if the count goes up.
      - name: Typecheck
        run: npm run typecheck:ratchet

      - name: Test
        run: npm test

  # Browser smoke tests for the wedge journey. Its own job so a flaky browser
  # doesn't hold up the API suite's verdict, and its own database (`_e2e`).
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/postgres
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      # Traces and screenshots for whatever failed — a red E2E with no trace
      # is a red E2E you re-run and hope.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Fails the build if a credential is anywhere in the repository's history.
  #
  # The gitleaks *action* scans only the pushed commits on a push event and the
  # whole history on a manual run — so the same commit passed on push and
  # failed on dispatch, and "required check" quietly meant "diff check". The
  # binary is run directly instead, with no commit range, so every event scans
  # everything and the answer can't depend on how the run was triggered.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks detect --source . --redact --exit-code 1 --no-banner

  mobile:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # Its own lockfile, so its cache is keyed on it and not on the root's.
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      # No tests yet on mobile; the typecheck is the gate. When a test runner
      # is added there, it goes here, and the job name stays the same so the
      # branch protection keeps covering it.
      - name: Typecheck
        run: npm run typecheck
