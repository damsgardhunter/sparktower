# How this app runs on Render.
#
# A blueprint rather than a page of clicks: the service, its build, its health
# check and the full list of environment variables it needs live here, in the
# repository, next to the code that reads them. A deploy someone configured by
# hand is a deploy nobody else can reproduce.
#
# `sync: false` means "Render prompts for this and stores it; never read it from
# the repo". Every secret is marked that way. Nothing here holds a value that
# shouldn't be public.
#
# To use it: Render → New → Blueprint → point at this repository. Then fill in
# the prompted values. The source of truth for how this product is deployed —
# the live URL, where each value comes from, how to verify a deploy came up
# right — is docs/ops/deploy.md.

services:
  - type: web
    name: sparktower
    runtime: node
    # Not the free plan (it sleeps, and a sleeping process runs no background
    # jobs), and not the 512MB one: the client build peaks around 1.05GB in a
    # single process — measured, not guessed — so 512MB dies mid-build with an
    # out-of-memory that reads like a broken repository. 2GB builds comfortably.
    plan: standard
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    # `npm run start` rather than `node dist/index.cjs`: the script sets
    # NODE_ENV=production itself, so the app can't come up in development mode
    # because one environment variable went missing.
    startCommand: npm run start
    # Migrations run before the new version takes traffic, which is the order
    # the release checklist asks for and the one nobody remembers under
    # pressure. A failed migration fails the deploy and the old version keeps
    # serving. (Paid plans only — which this is.)
    preDeployCommand: npm run db:migrate
    # The app answers this before it has finished booting, on purpose, so a
    # deploy isn't failed by a probe that arrives during startup work. It does
    # NOT check the database: see /_ready in server/app.ts for why.
    healthCheckPath: /_health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render provides PORT; the server reads it (server/index.ts).
      - key: NODE_VERSION
        value: "20"

      # --- Refuses to boot without these (server/secrets.ts) ----------------
      - key: SESSION_SECRET
        generateValue: true # 32+ random chars, held by Render, never in the repo
      - key: MOBILE_TOKEN_SECRET
        generateValue: true # deliberately a different value from SESSION_SECRET
      # Must be reachable from Render. A localhost URL copied out of a local
      # .env produces a deploy that goes live, answers /_health with a 200, and
      # fails every query with ECONNREFUSED 127.0.0.1 — which is exactly what
      # the first deploy of this service did. `fromDatabase` wires it
      # automatically when the blueprint creates the database below.
      - key: DATABASE_URL
        fromDatabase:
          name: sparktower-db
          property: connectionString
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false

      # --- The site's own address. Everything below it depends on this ------
      # Invite, verification and password-reset links, whether the sitemap is
      # indexable, the Stripe webhook registering itself, the CSRF trusted
      # origins, and the Google OAuth callback.
      #
      # Deliberately NOT a value here, though it is not a secret.
      #
      # This file used to declare https://sparktower.app while the running
      # service served https://sparktower.onrender.com — the dashboard had been
      # corrected and the blueprint had not. Re-syncing the blueprint would
      # therefore have re-pointed the product at a domain that is still a
      # parked page: every reset link, every confirm-your-email link and every
      # shared artifact URL would have led somewhere with no app behind it, and
      # the Stripe webhook and OAuth callback would have registered against a
      # host that never answers.
      #
      # The site's address is an operational fact that changes on the day DNS
      # moves, not a constant of the repository. `sync: false` makes Render
      # keep what the dashboard holds and prompt when it is missing. Changing it
      # is step one of the DNS move — see docs/ops/deploy.md.
      - key: PUBLIC_URL
        sync: false

      # --- Who runs the place ------------------------------------------------
      - key: PLATFORM_OWNER_EMAIL
        sync: false
      - key: PLATFORM_REVIEWER_EMAILS
        sync: false

      # --- Uploads ------------------------------------------------------------
      # Production refuses to write uploads to the container's disk, which on
      # Render is wiped every deploy. Both of these or no uploads.
      - key: PRIVATE_OBJECT_DIR
        sync: false # /<bucket>/<prefix>
      - key: PUBLIC_OBJECT_SEARCH_PATHS
        sync: false
      - key: GCS_SERVICE_ACCOUNT_KEY
        sync: false # the whole service-account JSON, or base64 of it
      - key: GOOGLE_CLOUD_PROJECT
        sync: false

      # --- Sign in with Google ------------------------------------------------
      # The redirect URI in the Google console must match PUBLIC_URL exactly —
      # today that is https://sparktower.onrender.com/api/auth/google/callback,
      # and it becomes the sparktower.app one on the day DNS moves. Both can be
      # registered at once, which is what makes the move survivable. The server
      # prints the callback it will use at boot; that line is the answer when
      # sign-in with Google starts failing after a deploy.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false

      # --- Money ---------------------------------------------------------------
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # from the endpoint the app registers on first boot

      # --- Mail ----------------------------------------------------------------
      # SPF, DKIM and DMARC are published for sparktower.app and verified by
      # `npm run check:email-auth` (2026-09-22: SPF pass, DKIM `resend`, DMARC
      # p=quarantine). So these can be set: mail now authenticates rather than
      # being quarantined. Without them the product still runs, and every
      # confirm-your-email link goes to the server log instead of the person —
      # which means nobody who signs up can post, comment, message or invite.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # --- Where a 500 goes besides stderr (server/error-reporting.ts) --------
      - key: ERROR_WEBHOOK_URL
        sync: false
      # The deploy an error came from needs no variable here: Render sets
      # RENDER_GIT_COMMIT on every service, and the reporter reads it.

      # --- Optional ------------------------------------------------------------
      - key: GITHUB_TOKEN
        sync: false # the code-audit feature reads repositories
      - key: PRINTFUL_API_KEY
        sync: false
      - key: PRINTFUL_STORE_ID
        sync: false

databases:
  - name: sparktower-db
    databaseName: sparktower
    plan: basic-256mb
    region: oregon
