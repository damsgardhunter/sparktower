<!--
  The activity bar icon. Monochrome and single-path on purpose: VS Code tints
  activity bar icons with the theme's foreground colour, so anything with its
  own colours comes out wrong in half the themes people use.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
  <path d="M12 2 14.1 8.3 20.5 8.3 15.3 12.2 17.3 18.5 12 14.6 6.7 18.5 8.7 12.2 3.5 8.3 9.9 8.3Z" opacity="0.9"/>
  <circle cx="12" cy="11.5" r="2.1" fill="none" stroke="currentColor" stroke-width="1.4"/>
</svg>
